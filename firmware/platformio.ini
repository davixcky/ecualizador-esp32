; Firmware del ecualizador de tres bandas con visualizador (ESP32-DevKitC V4).
; Compilar:  pio run          Cargar:  pio run -t upload       Monitor:  pio device monitor
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DFW_VERSION=\"fw-v1.0.0\" -Wall
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit GFX Library@1.12.1

; Placa única E.2 (hardware/E2-placa-unica): mismos módulos, otros GPIO.  pio run -e e2
[env:e2]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPLACA_E2

; Placa E.3-LM324: ruteo CNC revisado y entradas ADC protegidas.  pio run -e e3
[env:e3]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPLACA_E3

; E.4 conserva el mapa GPIO de E.3 y mejora la soldabilidad.  pio run -e e4
[env:e4]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPLACA_E4

; E.5 con pantalla aparte (decisión 2026-11-24): ESP32 DevKit V1 de 30 pines, sin TFT directa.
; Conserva el mapa analógico, la FFT, la tira NeoPixel y la página web de E.3/E.4 y transmite
; niveles y espectro a la pantalla de la tapa por ESP-NOW en difusión (canal 1, el del punto
; de acceso) y, como respaldo cableado, por Serial2 (TX2=GPIO17, RX2=GPIO16). Protocolo en
; include/enlace_cyd.h, compartido con firmware-cyd/. PROPUESTA: ningún enlace con la
; pantalla está todavía en el esquemático. Sin biblioteca ST7789: aquí no se compila código
; de pantalla. Pines del DevKit V1 de 30 pines: PINES-DEVKIT-V1.md.  pio run -e e5cyd
[env:e5cyd]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPLACA_E5CYD
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
; El buscador de dependencias no evalúa los #ifdef: sin esto arrastraría lib/interfaz
; (y con ella Adafruit GFX) aunque main.cpp no la incluye en esta variante.
lib_ignore = interfaz
