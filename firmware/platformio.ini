; Firmware del ecualizador de tres bandas con visualizador (ESP32-DevKitC V4).
; Compilar:  pio run          Cargar:  pio run -t upload       Monitor:  pio device monitor
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DFW_VERSION=\"fw-v1.0.0\" -Wall
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit GFX Library@1.12.1

; Placa única E.2 (hardware/E2-placa-unica): mismos módulos, otros GPIO.  pio run -e e2
[env:e2]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPLACA_E2
