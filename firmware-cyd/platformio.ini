; Interfaz del ecualizador E.5 sobre la pantalla del tipo "CYD" montada en VERTICAL (retrato).
;
; La placa RECIBIDA (2026-11-24, serigrafía leída por el comprador) es una ESP32-3248S035:
; panel de 3,5 pulgadas, 320 x 480, controlador ST7796, luz de fondo en GPIO27. No es la
; ESP32-2432S028 de 2,8 pulgadas que anuncia el título de la publicación: el modelo 3D y las
; probetas siguen dibujando la de 2,8 y deben actualizarse.
;
;   Cargar la placa recibida:   pio run -e cyd35 -t upload
;   Variantes 2,8" (histórico): pio run -e cyd -t upload      (ILI9341, micro-USB sola)
;                               pio run -e cyd2usb -t upload  (ST7789, micro-USB + USB-C)
;   Diagnóstico:                pio run -e probe -t upload    (ID del panel y fases de luz)
;
; Pines comunes del bus según la documentación comunitaria (witnessmenow / macsbug).
; Solo dibuja la interfaz propuesta con VALORES DE EJEMPLO y recibe tramas $EQ5 por P1 (UART0).

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = bodmer/TFT_eSPI@2.5.43
build_src_filter = +<*> -<probe/>
build_flags =
    -Wall
    -DUSER_SETUP_LOADED=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT

; ESP32-3248S035: la placa que llegó. ST7796 de 320 x 480, luz de fondo en GPIO27.
[env:cyd35]
build_flags =
    ${env.build_flags}
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_BL=27
    -DSPI_FREQUENCY=27000000

; ESP32-2432S028 de 2,8" (variante ILI9341, micro-USB sola). Histórico: no es la placa recibida.
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000

; ESP32-2432S028 de 2,8" (variante ST7789 de dos USB). Histórico: no es la placa recibida.
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000

; Sonda de diagnóstico: identifica el controlador por SPI y prueba la luz de fondo en
; GPIO21 y GPIO27 por fases (ver src/probe/probe.cpp). Cargar solo para diagnosticar.
[env:probe]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=27000000
build_src_filter = -<main.cpp> +<probe/probe.cpp>
